name: "Bug Report"
description: "File a bug report or decompression issue in przm"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in przm.
        Please make sure your report contains sufficient detail for reproduction.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal Go or C code / bitstream sample to reproduce the issue.
      render: Go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Logs
      description: Paste any error messages, assert failures, or unexpected output here.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "OS, CPU architecture (AVX2/AVX-512/NEON), Go version / C compiler."
    validations:
      required: true
